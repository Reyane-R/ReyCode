name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runs-on: macos-14, os: macos, arch: aarch64 }
          - { runs-on: macos-13, os: macos, arch: x86_64 }
          - { runs-on: ubuntu-24.04, os: linux, arch: x86_64 }
          - { runs-on: ubuntu-24.04-arm, os: linux, arch: aarch64 }
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: 1.19.5
          otp-version: 28.3.1
      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: release-${{ matrix.os }}-${{ matrix.arch }}-mix-${{ hashFiles('mix.lock') }}
      - run: mix deps.get
      - run: MIX_ENV=prod mix release --overwrite
      - name: Package per-platform tarball
        run: |
          version="${GITHUB_REF_NAME#v}"
          tarball="$(ls _build/prod/*.tar.gz | head -1)"
          mkdir -p "dist/reycode-${version}"
          tar -xzf "$tarball" -C "dist/reycode-${version}"
          tar -czf "reycode-${version}-${{ matrix.os }}-${{ matrix.arch }}.tar.gz" -C dist "reycode-${version}"
      - uses: actions/upload-artifact@v4
        with:
          name: reycode-${{ matrix.os }}-${{ matrix.arch }}
          path: reycode-*.tar.gz
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz \
            --title "ReyCode $GITHUB_REF_NAME" \
            --generate-notes
